<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADMIN PANEL - Onike AI</title>
  <style>
    body { font-family: Arial; background: #0a0a0a; color: white; padding: 20px; text-align: center; }
    h1 { color: #ff0000; }
    .admin-box { background: #1a1a1a; border: 2px solid red; padding: 20px; border-radius: 15px; max-width: 400px; margin: 20px auto; }
    input { width: 90%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; font-size: 16px; }
    .btn { background: red; color: white; padding: 18px; border-radius: 15px; text-decoration: none; font-size: 18px; font-weight: bold; display: block; }
    .hidden { display: none; }
    .warning { color: yellow; font-size: 14px; }
  </style>
</head>
<body>
  <h1>🔐 ADMIN LOGIN</h1>

  <!-- PASSWORD SCREEN -->
  <div id="login" class="admin-box">
    <input type="password" id="pass" placeholder="Enter Admin Password">
    <a href="#" onclick="checkPass()" class="btn">Login</a>
    <p id="error" style="color:red;"></p>
  </div>

  <!-- ADMIN SCREEN - HIDDEN UNTIL PASSWORD -->
  <div id="admin" class="admin-box hidden">
    <h3>Add Credits to User</h3>
    <input type="tel" id="number" placeholder="User WhatsApp: 2567XXXXXXXXX">
    <input type="number" id="amount" placeholder="Amount of Credits">
    <a id="whatsapp-btn" href="#" class="btn">📲 Add Credits</a>
  </div>

  <script>
    const ADMIN_PASSWORD = "gerardo23"; // <-- CHANGE THIS TO YOUR OWN PASSWORD

    function checkPass() {
      let input = document.getElementById('pass').value;
      if(input === ADMIN_PASSWORD) {
        document.getElementById('login').classList.add('hidden');
        document.getElementById('admin').classList.remove('hidden');
      } else {
        document.getElementById('error').innerText = "Wrong Password!";
      }
    }

    document.getElementById('whatsapp-btn').onclick = function() {
      let num = document.getElementById('number').value;
      let amt = document.getElementById('amount').value;
      let msg = `ADMIN ACTION: Add ${amt} Credits to ${num}. Please update wallet.`;
      this.href = `https://wa.me/256795377453?text=${encodeURIComponent(msg)}`;
    }
  </script>
</body>
</html>
